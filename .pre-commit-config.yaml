ci:
    skip: [
        "uv-lock",
        "mypy",
    ]

repos:

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-toml
    -   id: check-yaml
        args: [
          "--unsafe",
          ]
    -   id: check-json
    -   id: trailing-whitespace
        args: [
            "--markdown-linebreak-ext=md"
            ]

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
    -   id: ruff-check
    -   id: ruff-format

-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
    -   id: uv-lock

-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        # Runs in the project environment, since the django-stubs plugin needs Django and the settings.
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
