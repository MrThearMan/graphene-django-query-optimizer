[project]
name = "graphene-django-query-optimizer"
version = "0.10.17"
description = "Automatically optimize SQL queries in Graphene-Django schemas."
authors = [
    { name = "Matti Lamppu", email = "lamppu.matti.akseli@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = [
    "django",
    "graphene",
    "sql",
    "graphql",
    "python",
    "query",
    "optimizer",
    "optimization",
]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.18",
    "graphene>=3.4.3",
    "graphene-django>=3.2.3",
    "graphql-core>=3.2.13",
    "graphql-relay>=3.2.0",
    "django-settings-holder>=0.3.1",
    "typing-extensions>=4.16.0",
]

[project.urls]
"Homepage" = "https://mrthearman.github.io/graphene-django-query-optimizer"
"Repository" = "https://github.com/MrThearMan/graphene-django-query-optimizer"
"Bug Tracker" = "https://github.com/MrThearMan/graphene-django-query-optimizer/issues"
"Documentation" = "https://mrthearman.github.io/graphene-django-query-optimizer"

[dependency-groups]
test = [
    "pytest==9.1.1",
    "coverage==7.16.2",
    "pytest-django==4.14.0",
    "nox==2026.8.17",
    "faker==40.43.0",
    "factory-boy==3.3.3",
    "sqlparse==0.6.0",
    "django-graphiql-debug-toolbar==0.2.0",
    "django-filter==26.2",
]
docs = [
    "zensical==0.0.70",
    "pymdown-extensions==12.3",
    "pygments==2.21.0",
]
lint = [
    "prek==0.5.5",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "django-stubs==6.1.2",
    "py-spy==0.4.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
# The package is at the repository root, not under "src".
module-root = ""
module-name = [
    "query_optimizer",
]

[tool.coverage.run]
relative_files = true
branch = true
include = [
    "query_optimizer/*",
]

[tool.coverage.report]
fail_under = 100
exclude_also = [
    'if TYPE_CHECKING:',
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.config.settings"
filterwarnings = [
    "error",
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
]
exclude = [
    "^tests/",
    "^docs/",
    "^site/",
]

[[tool.mypy.overrides]]
module = [
    "django_filters.*",
    "graphene.*",
    "graphene_django.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "example_project.config.settings"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
