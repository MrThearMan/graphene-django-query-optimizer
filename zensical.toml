[project]
site_name = "Graphene Django Query Optimizer"
site_description = "Automatically optimize SQL queries in Graphene-Django schemas."
site_url = "https://mrthearman.github.io/graphene-django-query-optimizer/"

repo_url = "https://github.com/MrThearMan/graphene-django-query-optimizer"
repo_name = "MrThearMan/graphene-django-query-optimizer"

extra_css = [
  "css/docs.css",
  "css/pygments.css",
]
extra_javascript = [
  "js/docs.js",
]

nav = [
  { "Home" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Relay" = "relay.md" },
  { "Filtering" = "filtering.md" },
  { "Depth Limiting" = "depth.md" },
  { "Fragments" = "fragments.md" },
  { "Custom Fields" = "custom.md" },
  { "Settings" = "settings.md" },
  { "Technical Details" = "technical.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
variant = "modern"
custom_dir = "docs/overrides"
language = "en"
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.markdown_extensions]
attr_list = {}
meta = {}
toc.permalink = "🔗"
pymdownx.blocks.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
